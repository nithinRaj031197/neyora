# ============================================================================
# NEYORA — homepage
#
# Every headline, paragraph, button label and image on the homepage.
#
# Each section has an `enabled` flag: set it to false to hide the whole block
# without losing the copy you wrote for it. Useful when you have no
# testimonials yet, or nothing in season.
# ============================================================================

hero:
  eyebrow: Natural food, grown with care
  headline: NEYORA
  subheadline: GROWN FOR LIFE.
  description: >-
    Fresh food grown with care. We start each day in the growing rooms and
    finish it packing what was ready — nothing sits waiting for an order.
  image:
    src: /images/hero/oyster-mushroom-hero.svg
    alt: Clusters of fresh grey oyster mushrooms on raw linen in soft morning light
    width: 1920
    height: 1280
    caption: Grey oyster mushrooms, picked at first light.
  ctaLabel: Explore our products
  ctaHref: /products
  secondaryCtaLabel: Discover our recipes
  secondaryCtaHref: /recipes

products:
  enabled: true
  eyebrow: What we grow
  heading: Harvested to order, never to stock
  description: >-
    One crop today, more to come. Everything we grow is held to the same
    standard — picked at its peak, cooled straight away, and moved quickly.
  ctaLabel: View all products
  ctaHref: /products

why:
  enabled: true
  eyebrow: Why NEYORA
  heading: Quality without compromise
  description: Four things we do not negotiate on, whatever we are growing.
  pillars:
    - title: Quality without compromise
      description: >-
        We grade by hand and pack only what we would cook at home that evening.
        Anything short of it never leaves the farm.
    - title: Freshly grown
      description: >-
        Harvest happens the morning of dispatch. From cut to cold storage is
        under an hour, which is what keeps the texture intact.
    - title: Transparent farming
      description: >-
        Substrate, spawn source, water, growing conditions — ask us anything and
        we will tell you plainly. No vague claims.
    - title: Responsible growing
      description: >-
        Agricultural waste becomes our substrate; spent substrate returns to the
        soil as compost. Very little leaves the loop.

farm:
  enabled: true
  eyebrow: Our farm
  heading: A quiet room, the right air, and time
  description: >-
    Oyster mushrooms are honest. Get the humidity, air exchange and cleanliness
    right and they grow beautifully. Get it wrong and there is nowhere to hide.
  body: >-
    We grow in a controlled room built from ordinary materials — nothing exotic.
    The work is in the routine: pasteurising substrate properly, keeping the
    room clean, watching the air, and picking at exactly the right moment.
  image:
    src: /images/farm/growing-room.svg
    alt: Rows of substrate bags in the NEYORA growing room, daylight through an open doorway
    width: 1600
    height: 1200
  ctaLabel: Read our farm story
  ctaHref: /farm

recipes:
  enabled: true
  eyebrow: From the kitchen
  heading: What to cook tonight
  description: >-
    Simple, well-tested ways to use a pack while it is at its best. Most take
    under twenty minutes.
  ctaLabel: Browse all recipes
  ctaHref: /recipes

community:
  enabled: true
  eyebrow: Our community
  heading: Cooked by people who care what they eat
  description: A few words from the kitchens we deliver to.

social:
  enabled: true
  eyebrow: Follow along
  heading: Growing, harvesting, cooking
  description: Day-to-day from the farm and the kitchen.
  handle: "@neyora"

finalCta:
  enabled: true
  eyebrow: Start here
  heading: Fresh food, grown for life
  description: >-
    Order a pack, cook it the same week, and tell us what you thought. That
    feedback is how we improve.
  ctaLabel: See our products
  ctaHref: /products
  image:
    src: /images/hero/final-cta.svg
    alt: Fresh produce laid out on a linen cloth in warm daylight
    width: 1800
    height: 900

seo:
  title: NEYORA — Fresh Natural Food, Grown For Life
  description: >-
    NEYORA grows fresh natural food with care. Premium oyster mushrooms
    harvested to order, plus simple recipes to cook them at their best.
  ogImage: /images/hero/oyster-mushroom-hero.svg
